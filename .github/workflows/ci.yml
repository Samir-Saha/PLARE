# Runs the same checks AGENTS.md requires before every commit, on every push and pull request.
# Deploys are handled by Render and Vercel's own Git integrations (see DEPLOY.md): turn on
# "deploy only when checks pass" there so a red build never ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plare
          POSTGRES_PASSWORD: plare
          POSTGRES_DB: plare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on Postgres
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://plare:plare@localhost:5432/plare_test

  web:
    name: Web type-check, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
