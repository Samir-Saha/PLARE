# Render Blueprint for the PLARE API. Render reads this file when you choose
# New > Blueprint and connect this repo. See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: plare-api
    runtime: python
    plan: free
    region: virginia
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        value: https://cswawrqsrbmnenhtaytp.supabase.co
      # Supabase > Connect > Session pooler connection string, with your database password filled in.
      - key: DATABASE_URL
        sync: false
      # Your Vercel URL, for example https://plare.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      # Demo sign-in with the demo group (real names, made-up records). Turn off once real groups use the app.
      - key: DEMO_AUTH
        value: "true"
      # Render's free disk is temporary: uploads disappear when the service restarts.
      # Set SUPABASE_SERVICE_ROLE_KEY (and optionally SUPABASE_STORAGE_BUCKET) to keep files in a private bucket.
      - key: UPLOAD_DIR
        value: /tmp/plare-uploads
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: plare-uploads
      # Free Hugging Face token for the AI-writing check. Leave unset and reviewers see "AI check not set up".
      - key: HF_TOKEN
        sync: false
      # Web Push. Generate with `python -m app.push keys`. Leave unset and push shows "not set up".
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Secret for POST /cron/tick, so an outside scheduler can wake the free-plan server every minute.
      - key: CRON_SECRET
        sync: false
